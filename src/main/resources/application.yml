server:
  port: 8081
spring:
  application:
    name: Ecommerce-website
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_dB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root1234}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        multiTenancy: SCHEMA
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-me}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:86400}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:sk_test_xxxxxxxxxxxxx}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_xxxxxxxxxxxxx}
