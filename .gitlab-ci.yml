image: maven:3.9.8-eclipse-temurin-21

stages:
  - test
  - build
  - deploy_staging
  - review
  - deploy_production

variables:
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/

build:
  stage: build
  needs:
    - job: test
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    expire_in: 14 days
    paths:
      - target/*.jar
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy_staging:
  stage: deploy_staging
  needs:
    - job: build
  script:
    - echo "Deploying to staging..."
    - echo "Replace this with your real staging deploy command (SSH/Kubernetes/VM/etc)."
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
production_approval:
  stage: review
  needs:
    - job: deploy_staging
  script:
    - echo "Human review checkpoint approved."
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy_production
  needs:
    - job: production_approval
  script:
    - echo "Deploying to production..."
    - echo "Replace this with your real production deploy command."
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
