image: maven:3.9.8-eclipse-temurin-21

stages:
  - test
  - build
  - docker
  - deploy_staging
  - review
  - deploy_production

variables:
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: ecommerce_dB
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: root123
    DB_URL: jdbc:postgresql://postgres:5432/ecommerce_dB
    DB_USERNAME: postgres
    DB_PASSWORD: root123
    JWT_SECRET: ci-jwt-secret-key
    STRIPE_SECRET_KEY: sk_test_ci_placeholder
    STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/

build:
  stage: build
  needs:
    - job: test
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    expire_in: 14 days
    paths:
      - target/*.jar
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

docker_publish:
  stage: docker
  image: docker:27.1.2
  services:
    - name: docker:27.1.2-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - export IMAGE_REF="$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker build --pull -t "$IMAGE_REF" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_REF"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - echo "IMAGE_TAG=$IMAGE_TAG" > docker.env
    - echo "IMAGE_REF=$IMAGE_REF" >> docker.env
  artifacts:
    reports:
      dotenv: docker.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_staging:
  stage: deploy_staging
  needs:
    - job: docker_publish
      artifacts: true
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "Connecting to $PROD_SERVER_IP"
    - ssh-keyscan -H "$PROD_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - ssh ec2-user@"$PROD_SERVER_IP" "
        cd $PROD_DEPLOY_PATH &&
        ls -la &&
        printf 'IMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\nREDIS_PASSWORD=%s\n' '$IMAGE_TAG' '$POSTGRES_PASSWORD' '$REDIS_PASSWORD' > .env.production &&
        docker compose pull &&
        docker compose -f docker-compose.production.yml up -d --remove-orphans
      "
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
production_approval:
  stage: review
  needs:
    - job: deploy_staging
  script:
    - echo "Human review checkpoint approved."
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy_production
  needs:
    - job: production_approval
    - job: docker_publish
      artifacts: true
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "Connecting to $PROD_SERVER_IP"
    - ssh-keyscan -H "$PROD_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - ssh ec2-user@"$PROD_SERVER_IP" "
        cd $PROD_DEPLOY_PATH &&
        ls -la &&
        printf 'IMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\nREDIS_PASSWORD=%s\n' '$IMAGE_TAG' '$POSTGRES_PASSWORD' '$REDIS_PASSWORD' > .env.production &&
        docker compose pull &&
        docker compose -f docker-compose.production.yml up -d --remove-orphans
      "
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
